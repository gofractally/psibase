name: Crates publish dry-run

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dry_run:
    name: Crates publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Fetch refs for version comparison
        run: |
          git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}
          git fetch --depth=1 origin ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/detect-version-bump
        id: version
        with:
          ref-a: ${{ github.event.pull_request.base.sha }}
          ref-b: ${{ github.event.pull_request.head.sha }}

      - uses: dtolnay/rust-toolchain@1.86.0
        if: steps.version.outputs.changed == 'true'

      - name: Dry-run crate publish
        if: steps.version.outputs.changed == 'true'
        run: |
          cd rust
          ./scripts/publish.sh --dry-run 2>&1 | tee /tmp/crates-dry-run.log || true
          ../.github/scripts/expect-crates-dry-run-errors.sh < /tmp/crates-dry-run.log
