name: Create draft release

# The caller must have built the psidk artifacts in the same run (this workflow
# attaches them to the draft release) and must grant `contents: write`.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to draft a release for (e.g. "vX.Y.Z")'
        required: true
        type: string

jobs:
  generate-changelog:
    name: Generate changelog
    uses: ./.github/workflows/generate-changelog.yml
    with:
      endtag: ${{ inputs.tag }}

  create-psibase-release:
    name: Release draft - ${{ inputs.tag }}
    runs-on: ubuntu-latest
    needs: generate-changelog
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4

      - name: Compose release notes
        id: notes
        env:
          TAG: ${{ inputs.tag }}
          CHANGELOG: ${{ needs.generate-changelog.outputs.changelog }}
        run: |
          : >release-notes.md
          if [[ $TAG == v0.* ]]; then
              cat >>release-notes.md <<'EOF'
          # Disclaimer

          This is a prerelease, and therefore there are no security or backwards compatibility guarantees.
          It is not recommended to use this in a production environment - use at your own risk.

          EOF
          fi
          printf '%s\n' "$CHANGELOG" >>release-notes.md
          if [[ $TAG == *-* ]]; then
              echo prerelease=true >>"$GITHUB_OUTPUT"
          else
              echo prerelease=false >>"$GITHUB_OUTPUT"
          fi

      - name: Create new Github Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            psidk-ubuntu-2204/psidk-ubuntu-2204.tar.gz
            psidk-ubuntu-2404/psidk-ubuntu-2404.tar.gz
            psidk-book/psidk-book.tar.gz
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ steps.notes.outputs.prerelease }}
          name: ${{ inputs.tag }}
          tag_name: ${{ inputs.tag }}
          body_path: release-notes.md
