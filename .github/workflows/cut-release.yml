name: Cut release

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - release/v0

permissions:
  contents: write
  pull-requests: write

jobs:
  open-release-pr:
    name: Open release/v0 PR
    if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: version
        run: |
          set +e
          .github/scripts/psibase-version.sh changed \
              "${{ github.event.before }}" \
              "${{ github.sha }}"
          code=$?
          set -e
          if (( code == 0 )); then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          elif (( code == 1 )); then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Create release/v0 at pre-bump main
        if: steps.version.outputs.changed == 'true'
        run: |
          if ! git ls-remote --exit-code origin refs/heads/release/v0 >/dev/null; then
            git push origin "${{ github.event.before }}:refs/heads/release/v0"
          fi

      - name: Open PR into release/v0
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_pr=$(gh pr list --base release/v0 --head main --state open --json number --jq '.[].number')
          if [[ -n "$open_pr" ]]; then
            echo "PR #${open_pr} is already open from main into release/v0"
            exit 0
          fi
          gh pr create --base release/v0 --head main \
              --title "Cut release from main" \
              --body 'Merge/conflict gate for the release cut. Merging this tags the release and drafts a GitHub Release.'

  tag-release:
    name: Tag release/v0
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Detect version bump
        id: version
        run: |
          set +e
          .github/scripts/psibase-version.sh changed \
              "${{ github.event.pull_request.base.sha }}" \
              HEAD
          code=$?
          set -e
          if (( code == 0 )); then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          elif (( code == 1 )); then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Create and push tag
        id: tag
        if: steps.version.outputs.changed == 'true'
        run: |
          ver=$(.github/scripts/psibase-version.sh at HEAD)
          tag=$(.github/scripts/psibase-version.sh tag-name "$ver")
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi
          if [[ $tag == *-pre ]]; then
            message="psibase prerelease version v$ver"
          else
            message="psibase version v$ver"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$message"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  build-psibase:
    name: Run Builds
    needs: tag-release
    if: needs.tag-release.outputs.tag != ''
    uses: ./.github/workflows/ubuntu-builder.yml
    with:
      ref: refs/tags/${{ needs.tag-release.outputs.tag }}

  draft-release:
    name: Draft release
    needs:
      - tag-release
      - build-psibase
    uses: ./.github/workflows/create-draft-release.yml
    with:
      tag: ${{ needs.tag-release.outputs.tag }}
