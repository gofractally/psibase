name: git-remote-psibase release tarballs

# Builds the static git-remote-psibase helper for Linux x86_64 and aarch64,
# packs the install tarballs that the Git package serves from Sites under
# git.<root>/install/, and attaches them to the GitHub release.
# Doc-only changes do not trigger it (paths below exclude *.md).

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main
      - "release/*"
    paths:
      - "rust/git-remote-psibase/**"
      - "rust/psibase/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "packages/user/Git/**"
      - ".github/workflows/git-remote-psibase.yml"
      - "!**/*.md"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "rust/git-remote-psibase/**"
      - "rust/psibase/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "packages/user/Git/**"
      - ".github/workflows/git-remote-psibase.yml"
      - "!**/*.md"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('git-remote-psibase-pr-{0}', github.event.pull_request.number) || format('git-remote-psibase-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.0"
  # Sites stores each file as one row (default maxValueSize 8 MiB).
  MAX_TARBALL_BYTES: "7340032"
  # All tarballs ship in one package; measured limit, see git-on-psibase.md.
  MAX_TOTAL_BYTES: "4456448"

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: musl C toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools

      - name: Build static helper
        working-directory: rust
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --locked --profile dist -p git-remote-psibase --target ${{ matrix.target }}
          bin=target/${{ matrix.target }}/dist/git-remote-psibase
          if readelf -l "$bin" | grep -q "Requesting program interpreter"; then
            echo "::error::$bin is dynamically linked"; exit 1
          fi
          ls -l "$bin"

      - name: Unit tests
        working-directory: rust
        run: cargo test --locked -p git-remote-psibase

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: git-remote-psibase-${{ matrix.arch }}
          path: rust/target/${{ matrix.target }}/dist/git-remote-psibase
          if-no-files-found: error
          retention-days: 7

  package:
    name: Pack tarballs
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: git-remote-psibase-*
          path: bins

      - name: Pack (fails over MAX_TARBALL_BYTES or MAX_TOTAL_BYTES)
        run: |
          version="${{ github.event_name == 'release' && github.event.release.tag_name || '' }}"
          [ -n "$version" ] || version="$(git describe --tags --always)"
          packages/user/Git/scripts/pack-install-dist.sh "$version" \
            x86_64=bins/git-remote-psibase-x86_64/git-remote-psibase \
            aarch64=bins/git-remote-psibase-aarch64/git-remote-psibase
          mkdir -p release
          cp packages/user/Git/install-dist/*.tar.gz release/
          cp packages/user/Git/install-dist/SHA256SUMS.txt release/SHA256SUMS
          cp packages/user/Git/install-dist/version.txt release/version
          # Unrendered template; the chain's own /install.sh has its URL baked in.
          cp packages/user/Git/service/src/install.sh release/install.sh
          ls -l release

      - name: Upload install-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: git-install-dist
          path: |
            packages/user/Git/install-dist/
            release/
          if-no-files-found: error

  attach:
    name: Attach to release
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download install-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: git-install-dist
          path: dist

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: |
            dist/release/git-remote-psibase-linux-x86_64.tar.gz
            dist/release/git-remote-psibase-linux-aarch64.tar.gz
            dist/release/install.sh
            dist/release/SHA256SUMS
            dist/release/version
