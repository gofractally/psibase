name: On Tag - Release Draft

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

jobs:
  build-psibase:
    name: Run Builds
    uses: ./.github/workflows/ubuntu-builder.yml

  prerelease-check:
    name: Prerelease Check
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.set-prerelease-var.outputs.prerelease }}
    steps:
      - name: Check prerelease condition (tag ${{ github.ref_name }} contains '-')
        id: set-prerelease-var
        shell: bash
        run: |
          if [[ ${{ github.ref_name }} == *-* ]]; then
              echo prerelease=true >>$GITHUB_OUTPUT
          else
              echo prerelease=false >>$GITHUB_OUTPUT
          fi
      - name: PRERELEASE=${{ steps.set-prerelease-var.outputs.prerelease }}
        id: output
        run: true

  generate-changelog:
    name: Generate changelog
    uses: ./.github/workflows/generate-changelog.yml
    with:
      endtag: ${{ github.ref_name }}

  create-psibase-release:
    name: Release draft - ${{github.ref_name}}
    runs-on: ubuntu-latest
    needs:
      - build-psibase
      - prerelease-check
      - generate-changelog
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4

      - name: Build release files list
        id: release-files
        run: |
          versions='${{ needs.build-psibase.outputs.ubuntu-versions }}'
          {
            echo 'files<<EOF'
            echo "$versions" | jq -r '.[] | "psidk-ubuntu-\(.)/psidk-ubuntu-\(.).tar.gz"'
            echo 'psidk-book/psidk-book.tar.gz'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create new Github Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.release-files.outputs.files }}
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{needs.prerelease-check.outputs.prerelease}}
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          body: ${{ needs.generate-changelog.outputs.changelog }}
