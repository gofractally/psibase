name: On Tag - Release Draft

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

jobs:
  build-psibase:
    name: Run Builds
    uses: ./.github/workflows/ubuntu-builder.yml

  draft-release:
    name: Draft release
    needs: build-psibase
    uses: ./.github/workflows/create-draft-release.yml
    with:
      tag: ${{ github.ref_name }}
