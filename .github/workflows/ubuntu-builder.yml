name: Ubuntu builds

on:
  workflow_call:
    inputs:
      all-platforms:
        type: boolean
        required: false
        default: true
      ref:
        description: "Ref to build; defaults to the ref that triggered the run"
        type: string
        required: false
        default: ""
    outputs:
      ubuntu-versions:
        description: Full list of Ubuntu versions for all-platforms builds
        value: ${{ jobs.ubuntu-versions.outputs.ubuntu-versions }}
    secrets:
      publish-package-login:
        required: false

jobs:
  ubuntu-versions:
    runs-on: ubuntu-latest
    outputs:
      ubuntu-versions: '["2204","2404","2604"]'
    steps:
      - run: true

  build:
    name: Ubuntu ${{ matrix.ubuntu-version }} - Build
    needs: ubuntu-versions
    runs-on: ubuntu-latest
    env:
      can-publish: ${{ !! secrets.publish-package-login }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: ${{ fromJSON(inputs.all-platforms && needs.ubuntu-versions.outputs.ubuntu-versions || '["2204"]') }}
    steps:
      - name: Timestamp
        id: ccache_cache_timestamp
        run: echo timestamp=`date -u +"%Y-%m-%d-%H-%M-%S"` >>$GITHUB_OUTPUT
      - name: Maximize build space
        uses: James-Mart/maximize-build-space@master
        with:
          root-reserve-mb: 24576
          temp-reserve-mb: 512
          remove-android: "true"
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
          submodules: false
          fetch-depth: 0
      - name: Preserve ccache
        uses: actions/cache@v3
        with:
          path: .caches
          key: $ubuntu-${{ matrix.ubuntu-version }}-caches-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            $ubuntu-${{ matrix.ubuntu-version }}-caches-
      - name: Build
        env:
          BUILDER_IMAGE_2204: 983d7b62457785036f381163a2e50039f304e517
          BUILDER_IMAGE_2404: 983d7b62457785036f381163a2e50039f304e517
          BUILDER_IMAGE_2604: 983d7b62457785036f381163a2e50039f304e517
        run: |
          BUILDER_IMAGE="ghcr.io/${{ github.repository_owner }}/psibase-builder-ubuntu-${{ matrix.ubuntu-version }}:$BUILDER_IMAGE_${{ matrix.ubuntu-version }}"
          echo $BUILDER_IMAGE
          bash ${GITHUB_WORKSPACE}/.github/scripts/build.sh ${GITHUB_WORKSPACE} "$BUILDER_IMAGE" ${{ matrix.ubuntu-version }}
      - name: Publish packages
        if: fromJSON(env.can-publish) && matrix.ubuntu-version == '2404'
        env:
          PUBLISH_LOGIN: ${{ secrets.publish-package-login }}
        run: bash ${GITHUB_WORKSPACE}/.github/scripts/publish.sh
      - name: Upload psidk-ubuntu-${{ matrix.ubuntu-version }}
        uses: actions/upload-artifact@v4
        with:
          name: psidk-ubuntu-${{ matrix.ubuntu-version }}
          path: build/psidk-ubuntu-${{ matrix.ubuntu-version }}.tar.gz
      - name: Upload psidk-book
        if: ${{ matrix.ubuntu-version == '2404' }}
        uses: actions/upload-artifact@v4
        with:
          name: psidk-book
          path: psidk-book.tar.gz

  e2e:
    name: E2E
    needs: build
    runs-on: ubuntu-latest
    env:
      # Same pin as the build job; image must include Playwright browsers
      # (image-builders PLAYWRIGHT_VERSION matching e2e/@playwright/test).
      BUILDER_IMAGE_2204: 983d7b62457785036f381163a2e50039f304e517
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Download psidk-ubuntu-2204
        uses: actions/download-artifact@v4
        with:
          name: psidk-ubuntu-2204
          # v4 drops files in the workspace root unless path is set; extract
          # below expects the artifact name as a directory.
          path: psidk-ubuntu-2204
      - name: Extract psidk
        run: |
          mkdir psidk-root
          tar xzf psidk-ubuntu-2204/psidk-ubuntu-2204.tar.gz -C psidk-root
          psinode_bin=$(find "$GITHUB_WORKSPACE/psidk-root" -name psinode -type f | head -1)
          psibase_bin=$(dirname "$psinode_bin")/psibase
          echo "PSINODE_BIN=${psinode_bin}" >> "$GITHUB_ENV"
          echo "PSIBASE_BIN=${psibase_bin}" >> "$GITHUB_ENV"
      - name: Run E2E suite
        run: |
          BUILDER_IMAGE="ghcr.io/${{ github.repository_owner }}/psibase-builder-ubuntu-2204:$BUILDER_IMAGE_2204"
          if ! docker image inspect "$BUILDER_IMAGE" >/dev/null 2>&1; then
            docker pull "$BUILDER_IMAGE"
          fi
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}/e2e" \
            -e PSINODE_BIN \
            -e PSIBASE_BIN \
            -e HOME="${GITHUB_WORKSPACE}/.caches/e2e-home" \
            --user "$(id -u):$(id -g)" \
            "$BUILDER_IMAGE" \
            bash -c 'mkdir -p "$HOME" && yarn install --immutable && yarn test'
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e/test-results/artifacts/
            e2e/test-results/html-report/
