name: Ubuntu builds

on:
  workflow_call:
    inputs:
      all-platforms:
        type: boolean
        required: false
        default: true
    secrets:
      publish-package-login:
        required: false

jobs:
  build:
    name: Ubuntu ${{ matrix.ubuntu-version }} - Build
    runs-on: ubuntu-latest
    env:
      can-publish: ${{ !! secrets.publish-package-login }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: ${{ fromJSON(inputs.all-platforms && '["2204","2404","2604"]' || '["2204"]') }}
    steps:
      - name: Timestamp
        id: ccache_cache_timestamp
        run: echo timestamp=`date -u +"%Y-%m-%d-%H-%M-%S"` >>$GITHUB_OUTPUT
      - name: Maximize build space
        uses: James-Mart/maximize-build-space@master
        with:
          root-reserve-mb: 24576
          temp-reserve-mb: 512
          remove-android: "true"
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: false
          fetch-depth: 0
      - name: Preserve ccache
        uses: actions/cache@v3
        with:
          path: .caches
          key: $ubuntu-${{ matrix.ubuntu-version }}-caches-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            $ubuntu-${{ matrix.ubuntu-version }}-caches-
      - name: Build
        env:
          BUILDER_IMAGE_2204: 56cc3229bf80136970f4c925b5d3fc9d07ce3c35
          BUILDER_IMAGE_2404: 56cc3229bf80136970f4c925b5d3fc9d07ce3c35
          BUILDER_IMAGE_2604: 56cc3229bf80136970f4c925b5d3fc9d07ce3c35
        run: |
          BUILDER_IMAGE="ghcr.io/${{ github.repository_owner }}/psibase-builder-ubuntu-${{ matrix.ubuntu-version }}:$BUILDER_IMAGE_${{ matrix.ubuntu-version }}"
          echo $BUILDER_IMAGE
          bash ${GITHUB_WORKSPACE}/.github/scripts/build.sh ${GITHUB_WORKSPACE} "$BUILDER_IMAGE" ${{ matrix.ubuntu-version }}
      - name: Publish packages
        if: fromJSON(env.can-publish) && matrix.ubuntu-version == '2404'
        env:
          PUBLISH_LOGIN: ${{ secrets.publish-package-login }}
        run: bash ${GITHUB_WORKSPACE}/.github/scripts/publish.sh
      - name: Upload psidk-ubuntu-${{ matrix.ubuntu-version }}
        uses: actions/upload-artifact@v4
        with:
          name: psidk-ubuntu-${{ matrix.ubuntu-version }}
          path: build/psidk-ubuntu-${{ matrix.ubuntu-version }}.tar.gz
      - name: Upload psidk-book
        if: ${{ matrix.ubuntu-version == '2404' }}
        uses: actions/upload-artifact@v4
        with:
          name: psidk-book
          path: psidk-book.tar.gz

  e2e:
    name: E2E
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Download psidk-ubuntu-2204
        uses: actions/download-artifact@v4
        with:
          name: psidk-ubuntu-2204
      - name: Extract psidk
        run: |
          mkdir psidk-root
          tar xzf psidk-ubuntu-2204/psidk-ubuntu-2204.tar.gz -C psidk-root
          psinode_bin=$(find psidk-root -name psinode -type f | head -1)
          psibase_bin=$(dirname "$psinode_bin")/psibase
          echo "PSINODE_BIN=${psinode_bin}" >> "$GITHUB_ENV"
          echo "PSIBASE_BIN=${psibase_bin}" >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./e2e/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}-${{ runner.os }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install E2E dependencies
        working-directory: e2e
        run: yarn install --immutable
      - name: Install Chromium
        working-directory: e2e
        run: yarn exec playwright install chromium --with-deps
      - name: Run E2E suite
        working-directory: e2e
        run: yarn test
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e/test-results/artifacts/
            e2e/test-results/html-report/
