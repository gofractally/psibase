[package]
name = "x-battlezone-pkg"
description = "Node-local Battlezone realtime (presence + match relay)"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[package.metadata.psibase]
package-name = "XBattlezone"
scope = "local"
services = ["x-bzone"]

[package.metadata.psibase.dependencies]
XHttp = "0.29.0"

[lib]
crate-type = ["rlib"]

[dependencies]
x-bzone = { path = "service", version = "0.29.0" }
