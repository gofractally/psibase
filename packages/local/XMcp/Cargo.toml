# X-MCP: node-local MCP endpoint (account/subdomain `x-mcp`).
# Standalone cargo workspace; built to wasm32-wasip1 and packaged as a LOCAL
# package by CMake (psibase_package ... LOCAL), like the C++ X* services.
[workspace]
resolver = "2"
members = ["."]

[package]
name = "x-mcp"
version = "0.29.0"
edition = "2021"
publish = false

[package.metadata.psibase]
package-name = "XMcp"
scope = "local"
server = "x-mcp"
flags = ["isPrivileged"]

[lib]
crate-type = ["rlib"]

[dependencies]
psibase = { path = "../../../rust/psibase", version = "0.29.0" }
psibase_macros = { path = "../../../rust/psibase_macros", version = "0.29.0" }
psibase_service = { path = "../../../rust/psibase_service", version = "0.29.0" }
async-graphql = "=7.0.17"
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.120"

[profile.release]
codegen-units = 1
opt-level = "s"
debug = false
strip = true
lto = true
