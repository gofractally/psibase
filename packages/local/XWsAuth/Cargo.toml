[workspace]
resolver = "2"
members = [".", "service"]

[workspace.package]
version = "0.29.0"
rust-version = "1.64"
edition = "2021"
repository = "https://github.com/gofractally/psibase"
homepage = "https://psibase.io"
license = "MIT"
publish = false

[workspace.dependencies]
psibase = { path = "../../../rust/psibase", version = "0.29.0" }
psibase_service = { path = "../../../rust/psibase_service", version = "0.29.0" }
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.125"

[profile.release]
codegen-units = 1
opt-level = "s"
debug = false
strip = true
lto = true

[package]
name = "x-wsauth-pkg"
description = "Mints single-use tickets that authenticate websockets to local services"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[package.metadata.psibase]
package-name = "XWsAuth"
scope = "local"
services = ["x-wsauth"]

[package.metadata.psibase.dependencies]
XHttp = "0.29.0"
Transact = "0.29.0"

[lib]
crate-type = ["rlib"]

[dependencies]
x-wsauth = { path = "service", version = "0.29.0" }
