[package]
name = "accounts-prompt"
version.workspace = true
edition.workspace = true

[dependencies]
wit-bindgen-rt.workspace = true
psibase.workspace = true
serde.workspace = true
serde_json.workspace = true
psibase-plugin-workspace-hack.workspace = true
psibase_plugin.workspace = true
thiserror.workspace = true

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "accounts:prompt"

[package.metadata.component.target]
world = "impl"

[package.metadata.component.target.dependencies]
"accounts:query" = { path = "../query/wit/world.wit" }
"transact:plugin" = { path = "../../../Transact/plugin/wit/world.wit" }
"invite:plugin" = { path = "../../../../user/Invite/plugin/wit/redemption.wit" }
"auth-sig:plugin" = { path = "../../../AuthSig/plugin/wit/world.wit" }
"auth-any:plugin" = { path = "../../../AuthAny/plugin/wit/world.wit" }
"name-market:plugin" = { path = "../../../../user/NameMarket/plugin/wit/world.wit" }

[package.metadata.component.bindings]
derives = ["serde::Deserialize"]

[package.metadata.component.bindings.with]
"host:types/types" = "psibase_plugin::types"