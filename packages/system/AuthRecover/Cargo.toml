[package]
name = "auth-recover-pkg"                      # Crate name
description = "An auth service that authorizes a trusted third party to help a user reset his key."
version.workspace = true
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[package.metadata.psibase]
package-name = "AuthRecover"
services = ["auth-recover"]

[package.metadata.psibase.dependencies]
Host = "0.29.0"
HttpServer = "0.29.0"
Permissions = "0.29.0"
Sites = "0.29.0"
Transact = "0.29.0"

[lib]
crate-type = ["rlib"]

[dependencies]
auth-recover = { path = "service", version = "0.29.0" }
r-auth-recover = { path = "query-service", version = "0.29.0" }
auth-recover-plugin = { path = "plugin", version = "0.29.0" }
