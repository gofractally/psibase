[package]
name = "auth-recover-plugin"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
auth-recover = { path = "../service/", version = "0.29.0" }
psibase.workspace = true
psibase_plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wit-bindgen-rt.workspace = true
psibase-system-workspace-hack.workspace = true

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "auth-recover:plugin"

[package.metadata.component.target]
world = "impl"

[package.metadata.component.bindings.with]
"host:types/types" = "psibase_plugin::types"

[package.metadata.component.target.dependencies]
"host:types" = { path = "../../../user/Host/plugin/types/wit/world.wit" }
"host:crypto" = { path = "../../../user/Host/plugin/crypto/wit/world.wit" }
"transact:plugin" = { path = "../../../system/Transact/plugin/transact/wit/world.wit" }
