[package]
name = "banx-pkg"                      # Crate name
description = "Mutual-credit ledger"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[package.metadata.psibase]
package-name = "Banx"
services = ["banx"]

[package.metadata.psibase.dependencies]
Accounts = "0.27.0"
Host = "0.27.0"
HttpServer = "0.27.0"
Sites = "0.27.0"
Transact = "0.27.0"
Permissions = "0.27.0"
Config = "0.27.0"
Tokens = "0.27.0"

[lib]
crate-type = ["rlib"]

[dependencies]
banx = { path = "service", version = "0.26.0" }
r-banx = { path = "query-service", version = "0.26.0" }
banx-plugin = { path = "plugin", version = "0.26.0" }
