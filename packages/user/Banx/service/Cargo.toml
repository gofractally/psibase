[package]
name = "banx"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[package.metadata.psibase]
server = "r-banx"
plugin = "banx-plugin"
data = [{ src = "../ui/dist", dst = "/" }]
postinstall = [
    { sender = "banx-app", service = "sites", method = "enablespa", rawData = "010001" },
    { sender = "banx-app", service = "banx-app", method = "init", data = {} },
]

[dependencies]
psibase.workspace = true
psibase_macros.workspace = true
psibase_service.workspace = true
async-graphql.workspace = true
serde.workspace = true
serde_json.workspace = true
psibase-user-workspace-hack.workspace = true

[dev-dependencies]
banx-pkg = { path = "..", version = "0.27.0" }
