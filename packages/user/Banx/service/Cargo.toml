[package]
name = "banx"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[package.metadata.psibase]
server = "r-banx"
plugins = ["banx-plugin"]
data = [{ src = "../ui/dist", dst = "/" }]
postinstall = [
    { sender = "banx-app", service = "sites", method = "enablespa", rawData = "010001" },
    { sender = "banx-app", service = "banx-app", method = "init", data = {} },
]

[dependencies]
psibase.workspace = true
psibase_macros.workspace = true
psibase_service.workspace = true
async-graphql.workspace = true
serde.workspace = true
serde_json.workspace = true
psibase-user-workspace-hack.workspace = true
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
banx-pkg = { path = "..", version = "0.29.0" }
