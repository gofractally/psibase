[package]
name = "branding-plugin"
version.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
publish = false

[dependencies]
psibase.workspace = true
serde.workspace = true
serde_json.workspace = true
wit-bindgen-rt.workspace = true
branding = { path = "../service/", version = "0.28.0" }
psibase-user-workspace-hack.workspace = true

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "branding:plugin"

[package.metadata.component.target]
world = "impl"

[package.metadata.component.target.dependencies]
"host:client" = { path = "../../Host/plugin/client/wit/world.wit" }
"host:http" = { path = "../../Host/plugin/http/wit/world.wit" }
"host:types" = { path = "../../Host/plugin/types/wit/world.wit" }
"transact:plugin" = { path = "../../../system/Transact/plugin/wit/world.wit" }
"sites:plugin" = { path = "../../Sites/plugin/wit/world.wit" }

[dev-dependencies]
branding-pkg = { path = "..", version = "0.28.0" }
