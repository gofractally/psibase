[package]
name = "btcbridge-pkg"
description = "Bitcoin SPV relay and deterministic 2-of-3 custody bridge"
version.workspace = true
edition.workspace = true
publish.workspace = true

[package.metadata.psibase]
package-name = "BtcBridge"
services = ["btcrelay", "btcbridge"]

[package.metadata.psibase.dependencies]
Signing = "0.29.0"
Host = "0.29.0"
Accounts = "0.29.0"
Supervisor = "0.29.0"
WebCrypto = "0.29.0"
Homepage = "0.29.0"
AuthSig = "0.29.0"
Profiles = "0.29.0"
Permissions = "0.29.0"
Tokens = "0.29.0"
Nft = "0.29.0"
HttpServer = "0.29.0"
Transact = "0.29.0"
Sites = "0.29.0"

[dependencies]
btcbridge-plugin = { path = "plugin" }
btcrelay-plugin = { path = "../BtcRelay/plugin" }
btcrelay = { path = "../BtcRelay/service" }
btcbridge = { path = "service" }
r-btcbridge = { path = "query-service" }
