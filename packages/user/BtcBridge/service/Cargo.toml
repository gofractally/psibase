[package]
name = "btcbridge"
version.workspace = true
edition.workspace = true
publish.workspace = true

[package.metadata.psibase]
server = "r-btcbridge"
plugins = ["btcbridge-plugin"]
postinstall = [
    { sender = "btcbridge", service = "sites", method = "setcsp", data = { path = "*", csp = "default-src 'self';script-src 'self';style-src 'self';img-src 'self' data: profiles.{{root}}/avatar/;connect-src 'self' profiles.{{root}} auth-sig.{{root}} https:;frame-src supervisor.{{root}};frame-ancestors 'self';base-uri 'none';form-action 'self';object-src 'none';" } },
]
data = [{ src = "../ui/dist", dst = "/" }]

[dependencies]
psio.workspace = true
psibase.workspace = true
psibase_service.workspace = true
serde.workspace = true
serde_json.workspace = true
btcbridge-core = { path = "../core" }
btcrelay = { path = "../../BtcRelay/service" }

signing = { path = "../../Signing/service" }

[dev-dependencies]
btcbridge-pkg = { path = ".." }
