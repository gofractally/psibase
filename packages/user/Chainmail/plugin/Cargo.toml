[package]
name = "chainmail-plugin"
version.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
publish = false

[dependencies]
wit-bindgen-rt.workspace = true
psibase.workspace = true
chainmail = { path = "../service", version = "0.28.0" }
serde_json.workspace = true
serde.workspace = true
serde-aux.workspace = true
chrono = "0.4"
psibase-user-workspace-hack.workspace = true

[dev-dependencies]
chainmail_package = { path = "..", version = "0.28.0" }

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "chainmail:plugin"

[package.metadata.component.target]
world = "impl"

[package.metadata.component.target.dependencies]
"host:client" = { path = "../../Host/plugin/client/wit/world.wit" }
"host:http" = { path = "../../Host/plugin/http/wit/world.wit" }
"host:types" = { path = "../../Host/plugin/types/wit/world.wit" }
"transact:plugin" = { path = "../../../system/Transact/plugin/transact/wit/world.wit" }
"accounts:query" = { path = "../../../system/Accounts/plugin/query/wit/world.wit" }
"permissions:plugin" = { path = "../../Permissions/plugin/wit/world.wit" }
