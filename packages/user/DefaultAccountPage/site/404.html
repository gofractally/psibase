<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="dark" />
        <title>Account not found</title>
        <link rel="stylesheet" href="/style.css" />
        <script src="/page.js" defer></script>
    </head>
    <body>
        <header>
            <a data-link="homepage" data-network hidden></a>
        </header>
        <main>
            <p class="eyebrow">404 · Account not found</p>
            <h1 data-account>This account</h1>
            <p>
                There is no account named
                <code data-account>this account</code> on this network, so
                there's nothing to show at this address.
            </p>
            <p><a data-link="homepage">Go to the network homepage</a></p>
        </main>
    </body>
</html>
