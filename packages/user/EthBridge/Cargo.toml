[package]
name = "ethbridge-pkg"
description = "Context-free Ethereum proof relay and 2-of-3 ETH custody bridge"
version.workspace = true
edition.workspace = true
publish.workspace = true
[package.metadata.psibase]
package-name = "EthBridge"
services = ["verify-eth", "ethrelay", "ethbridge"]
[package.metadata.psibase.dependencies]
Signing = "0.29.0"
Tokens = "0.29.0"
Nft = "0.29.0"
HttpServer = "0.29.0"
Transact = "0.29.0"
Sites = "0.29.0"
Homepage = "0.29.0"
Host = "0.29.0"
Accounts = "0.29.0"
Supervisor = "0.29.0"
WebCrypto = "0.29.0"
AuthSig = "0.29.0"
Permissions = "0.29.0"
[dependencies]
ethbridge-plugin = {path="plugin"}
verify-eth = { path = "../EthRelay/verify" }
ethrelay = { path = "../EthRelay/service" }
ethbridge = { path = "service" }
r-ethbridge = { path = "query-service" }
signing-pkg = {path="../Signing"}
