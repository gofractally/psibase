[package]
name = "ethbridge-relayer"
version = "0.29.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
psibase = {path="../../../../rust/psibase"}
ethrelay-core = {path="../../EthRelay/core",features=["bls"]}
serde = {version="1.0",features=["derive"]}
serde_json = "1.0"
reqwest = {version="0.13",features=["json"]}
tokio = {version="1",features=["macros","rt-multi-thread"]}
chrono = "0.4"
anyhow = "1"
url = "2"
