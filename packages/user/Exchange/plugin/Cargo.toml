[package]
name = "exchange-plugin"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
exchange = { path = "../service" }
psibase.workspace = true
psibase_plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
wit-bindgen-rt.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.component]
package = "exchange:plugin"

[package.metadata.component.target]
world = "impl"

[package.metadata.component.target.dependencies]
"transact:plugin" = { path = "../../../system/Transact/plugin/transact/wit/world.wit" }
"host:accounts" = { path = "../../Host/plugin/accounts/wit/world.wit" }
"host:types" = { path = "../../Host/plugin/types/wit/world.wit" }
"tokens:plugin" = { path = "../../Tokens/plugin/wit/world.wit" }

[package.metadata.component.bindings.with]
"host:types/types" = "psibase_plugin::types"
