[package]
name = "exchange"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true
[package.metadata.psibase]
server = "r-exchange"
data = [{ src = "../ui/dist", dst = "/" }]
postinstall = [
    { sender = "exchange", service = "exchange", method = "init", data = {} },
    { sender = "exchange", service = "events", method = "addIndex", data = { db = 0, service = "exchange", event = "traded", column = 0 } },
    { sender = "exchange", service = "events", method = "addIndex", data = { db = 0, service = "exchange", event = "liquidated", column = 0 } },
]
[dependencies]
psibase.workspace = true
psibase_service.workspace = true
serde.workspace = true
serde_json.workspace = true
async-graphql.workspace = true
tokens = { path = "../../Tokens/service" }
symbol = { path = "../../Symbol/service" }
[dev-dependencies]
exchange-pkg = { path = ".." }
