[package]
name = "favor-pkg"
description = "Private payments through personal credit relationships"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[package.metadata.psibase]
package-name = "Favor"
services = ["favor"]

[package.metadata.psibase.dependencies]
Accounts = "0.29.0"
Host = "0.29.0"
Homepage = "0.29.0"
HttpServer = "0.29.0"
Sites = "0.29.0"
Profiles = "0.29.0"
Transact = "0.29.0"
Permissions = "0.29.0"
WebCrypto = "0.29.0"

[dependencies]
favor = { path = "service" }
r-favor = { path = "query-service" }
favor-plugin = { path = "plugin" }

[lib]
crate-type = ["rlib"]
