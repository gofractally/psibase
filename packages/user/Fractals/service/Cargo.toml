[package]
name = "fractals"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[package.metadata.psibase]
server = "r-fractals"
plugin = "fractals-plugin"
data = [{ src = "../ui/dist", dst = "/" }]
postinstall = [
    { sender = "fractals", service = "sites", method = "enablespa", rawData = "010001" },
    { sender = "fractals", service = "sites", method = "setcsp", data = { path = "*", csp = "default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';img-src 'self' data: profiles.{{root}}/avatar/ branding.{{root}};font-src 'self';connect-src 'self' profiles.{{root}};frame-src supervisor.{{root}};frame-ancestors 'self';base-uri 'none';form-action 'self';object-src 'none';" } },
]

[package.metadata.psibase.dependencies]
TokenStream = "0.26.0"

[dependencies]
psibase.workspace = true
psibase_service.workspace = true
psibase_macros.workspace = true
evaluations = { path = "../../Evaluations/service", version = "0.26.0" }
async-graphql.workspace = true
serde.workspace = true
serde_json.workspace = true
psibase-user-workspace-hack.workspace = true

[dev-dependencies]
fractals-pkg = { path = "..", version = "0.26.0" }

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]
