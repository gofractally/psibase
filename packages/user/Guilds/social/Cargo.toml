version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[package.metadata.psibase]
server = "r-social"
plugins = ["social-plugin"]

[dependencies]
psibase.workspace = true
psibase_macros.workspace = true
