[package]
name = "host-db"
version.workspace = true
edition.workspace = true

[dependencies]
wit-bindgen-rt.workspace = true
psibase.workspace = true
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
regex = "1.0"
hex = "0.4"
psibase-plugin-workspace-hack.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aes_plugin = { package = "aes", path = "../../../Aes/plugin" }

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "host:db"

[package.metadata.component.target]
world = "impl"

[package.metadata.component.target.dependencies]
"supervisor:bridge" = { path = "./wit/deps/supervisor.wit" }
"host:types" = { path = "../types/wit/world.wit" }
"host:client" = { path = "../client/wit/world.wit" }
"aes:plugin" = { path = "../../../Aes/plugin/wit/world.wit" }
