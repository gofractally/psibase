# TEST-ONLY plugins for the Supervisor Playwright e2e suite
# (packages/user/Supervisor/e2e). Deliberately its own Cargo workspace: it is
# not a member of packages/Cargo.toml, so production plugin builds never compile
# it, and no psibase_package() in CMakeLists.txt ships it. The e2e flow builds
# it separately and adds the .wasm files to the Host package of the test chain
# only (see README.md here).
[workspace]
members = ["probe", "probe-user"]
resolver = "2"

[workspace.package]
version = "0.29.0"
edition = "2021"
publish = false

[workspace.dependencies]
wit-bindgen-rt = { version = "0.30.0", features = ["bitflags"] }
