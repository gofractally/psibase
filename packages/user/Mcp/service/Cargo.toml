[package]
name = "mcp"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[package.metadata.psibase]
server = "r-mcp"
plugins = ["mcp-plugin"]
data = [{ src = "../ui/dist/", dst = "/" }]
postinstall = [
    { sender = "mcp", service = "sites", method = "setcsp", data = { path = "*", csp = "default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';img-src 'self' data: profiles.{{root}}/avatar/ branding.{{root}};font-src 'self';connect-src 'self' profiles.{{root}} tokens.{{root}} staged-tx.{{root}};frame-src supervisor.{{root}};frame-ancestors 'self';base-uri 'none';form-action 'self';object-src 'none';" } },
]

[dependencies]
psibase.workspace = true
psibase_service.workspace = true
psibase_macros.workspace = true
async-graphql.workspace = true
serde.workspace = true
serde_json.workspace = true
psibase-user-workspace-hack.workspace = true

# Chain tests (wasm only) need the package; native unit tests do not.
[target.'cfg(target_family = "wasm")'.dev-dependencies]
mcp-pkg = { path = "..", version = "0.29.0" }
