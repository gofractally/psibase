[package]
name = "meet-plugin"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
meet = { path = "../service/", version = "0.27.0" }
psibase.workspace = true
serde.workspace = true
serde_json.workspace = true
wit-bindgen-rt.workspace = true
ecies = { version = "0.2", default-features = false, features = ["pure"] }
rand = "0.9.1"
sha2 = "0.10.8"
psibase-user-workspace-hack.workspace = true

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "meet:plugin"

[package.metadata.component.target]
world = "impl"

[package.metadata.component.target.dependencies]
"host:types" = { path = "../../Host/plugin/types/wit/world.wit" }
"host:common" = { path = "../../Host/plugin/common/wit/world.wit" }
"host:db" = { path = "../../Host/plugin/db/wit/world.wit" }
"transact:plugin" = { path = "../../../system/Transact/plugin/wit/world.wit" }
"permissions:plugin" = { path = "../../Permissions/plugin/wit/world.wit" }
"accounts:plugin" = { path = "../../../system/Accounts/plugin/accounts/wit/world.wit" }
