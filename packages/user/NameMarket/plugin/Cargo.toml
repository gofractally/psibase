[package]
name = "name-market-plugin"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
psibase_plugin.workspace = true
name-market = { path = "../service/", version = "0.27.0" }
psibase.workspace = true
serde.workspace = true
serde_json.workspace = true
wit-bindgen-rt.workspace = true
psibase-user-workspace-hack.workspace = true
pem = "3.0"
thiserror.workspace = true

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "name-market:plugin"

[package.metadata.component.target]
world = "impl"

[package.metadata.component.bindings.with]
"host:types/types" = "psibase_plugin::types"

[package.metadata.component.target.dependencies]
"host:types" = { path = "../../Host/plugin/types/wit/world.wit" }
"host:call-context" = { path = "../../Host/plugin/call-context/wit/world.wit" }
"host:authed-http" = { path = "../../Host/plugin/authed-http/wit/world.wit" }
"host:crypto" = { path = "../../Host/plugin/crypto/wit/world.wit" }
"tokens:plugin" = { path = "../../Tokens/plugin/wit/world.wit" }
"transact:plugin" = { path = "../../../system/Transact/plugin/wit/world.wit" }
"permissions:plugin" = { path = "../../Permissions/plugin/wit/world.wit" }
