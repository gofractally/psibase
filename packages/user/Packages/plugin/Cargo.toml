[package]
name = "packages"
version.workspace = true
edition.workspace = true

[dependencies]
wit-bindgen-rt.workspace = true
anyhow = "1.0"
async-trait = "0.1.77"
futures = "0.3"
getrandom = "0.3"
psibase.workspace = true
regex = "1"
serde.workspace = true
serde_json.workspace = true
chrono = "0.4.38"
sha2 = "0.10.6"
psibase-plugin-workspace-hack.workspace = true

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "packages:plugin"

[package.metadata.component.target]
world = "impl"

[package.metadata.component.target.dependencies]
"host:client" = { path = "../../Host/plugin/client/wit/world.wit" }
"host:http" = { path = "../../Host/plugin/http/wit/world.wit" }
"host:types" = { path = "../../Host/plugin/types/wit/world.wit" }
"sites:plugin" = { path = "../../Sites/plugin/wit/world.wit" }
"accounts:query" = { path = "../../../system/Accounts/plugin/query/wit/world.wit" }
"setcode:plugin" = { path = "../../../system/SetCode/plugin/wit/world.wit" }
"transact:plugin" = { path = "../../../system/Transact/plugin/transact/wit/world.wit" }

[package.metadata.component.bindings]
derives = ["serde::Deserialize", "serde::Serialize"]
