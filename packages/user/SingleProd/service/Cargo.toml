[package]
name = "single-prod"
version.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
publish.workspace = true

[package.metadata.psibase]
flags = ["isPrivileged"]
postinstall = [
    { sender = "tokens", service = "transact", method = "runAs", data = { action = { sender = "tokens", service = "singleprod", method = "create_token", data = {} }, allowedActions = [{ service = "tokens", method = "setSysToken" }] } },
    { sender = "symbol", service = "transact", method = "runAs", data = { action = { sender = "symbol", service = "singleprod", method = "set_symbol", data = {} }, allowedActions = [{ service = "symbol", method = "admin_create" }] } },
    { sender = "vserver", service = "transact", method = "runAs", data = { action = { sender = "vserver", service = "singleprod", method = "init_billing", data = {} }, allowedActions = [{ service = "vserver", method = "init_billing" }] } },
    { sender = "singleprod", service = "singleprod", method = "fund_producer" },
    { sender = "producers", service = "transact", method = "runAs", data = { action = { sender = "producers", service = "singleprod", method = "set_max_prods", data = {} }, allowedActions = [{ service = "producers", method = "setMaxProds" }] } },
]

[dependencies]
psibase.workspace = true
psibase_service.workspace = true
psibase-user-workspace-hack.workspace = true
serde.workspace = true

[package.metadata.psibase.dependencies]
Tokens = "0.29.0"
Symbol = "0.29.0"
Transact = "0.29.0"
TransactService = "0.29.0"
Nft = "0.29.0"
VirtualServer = "0.29.0"
Producers = "0.29.0"

[dev-dependencies]
single-prod-pkg = { path = "..", version = "0.29.0" }
