[package]
name = "token-stream"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[package.metadata.psibase]
postinstall = [
    { sender = "tok-stream", service = "sites", method = "enablespa", data = { enable = true } },
    { sender = "tok-stream", service = "tokens", method = "setUserConf", data = { index = 0, enabled = false } },
    { sender = "tok-stream", service = "sites", method = "setcsp", data = { path = "*", csp = "default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';img-src 'self' data: profiles.{{root}}/avatar/ branding.{{root}};font-src 'self';connect-src 'self' nft.{{root}} tokens.{{root}} profiles.{{root}};frame-src supervisor.{{root}};frame-ancestors 'self';base-uri 'none';form-action 'self';object-src 'none';" } },
]

server = "r-token-stream"
plugin = "token-stream-plugin"
data = [{ src = "../ui/dist", dst = "/" }]

[dependencies]
psibase.workspace = true
psibase_service.workspace = true
psibase_macros.workspace = true
async-graphql.workspace = true
serde.workspace = true
serde_json.workspace = true
psibase-user-workspace-hack.workspace = true

[dev-dependencies]
token-stream-pkg = { path = "..", version = "0.26.0" }
