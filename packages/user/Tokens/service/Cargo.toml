[package]
name = "tokens"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[package.metadata.psibase]
server = "r-tokens"
plugins = ["tokens-plugin"]
data = [{ src = "../ui/dist", dst = "/" }]
postinstall = [
    { sender = "tokens", service = "tokens", method = "init", data = {} },
    # The transfer confirmation is shown by the supervisor, in a frame.
    { sender = "tokens", service = "sites", method = "setcsp", data = { path = "/plugin/web/prompt/transfer/index.html", csp = "default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';img-src 'self' data:;font-src 'self';connect-src 'self';frame-src supervisor.{{root}};frame-ancestors 'self' supervisor.{{root}};base-uri 'none';form-action 'self';object-src 'none';" } },
]

[dependencies]
psio.workspace = true
psibase.workspace = true
psibase_service.workspace = true
psibase_macros.workspace = true
async-graphql.workspace = true
serde.workspace = true
serde_json.workspace = true
psibase-user-workspace-hack.workspace = true

[dev-dependencies]
tokens-pkg = { path = "..", version = "0.29.0" }
