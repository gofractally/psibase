<body><main class="review" aria-live="polite"><div class="brand"><span class="mark">T</span><span>Tokens<span class="sub">Native wallet authorization</span></span></div><h1>Review transfer</h1><p id="summary">Loading the exact transfer request…</p><div id="details" hidden><div class="amount"><span id="amount"></span> <span id="symbol"></span></div><dl><div><dt>Account</dt><dd id="user"></dd></div><div><dt>Requested by</dt><dd id="caller"></dd></div><div><dt>From</dt><dd id="from"></dd></div><div><dt>To</dt><dd id="to"></dd></div><div><dt>Token ID</dt><dd id="token"></dd></div><div><dt>Memo</dt><dd id="memo"></dd></div></dl><label class="trust"><input type="checkbox" id="remember"><span>Trust <span id="trust-app"></span> for future wallet transfers<span class="sub">Only transfers between your wallet and this app, for any token. Saved on this browser. Revoke it in the app’s account menu.</span></span></label><div class="buttons"><button id="cancel" class="secondary">Cancel</button><button id="approve">Authorize transfer</button></div></div><p id="error" role="alert" hidden></p><p class="foot">Your account’s native signing permissions still apply. This permission does not grant token issuance, configuration, or transfers to other accounts.</p></main><script type="module" src="/wallet-assets/transfer.mjs"></script></body>
